<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dataset · __PROJECT_NAME__</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface-1:#fcfcfb;--text-primary:#171717;--text-secondary:#62615d;--grid:#deddd8;--axis:#c6c3b9;--series-1:#2a78d6}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);font:16px/1.6 system-ui,sans-serif}
.wrap{padding-top:40px;padding-bottom:40px}
.dataset-placeholder{max-width:760px;min-height:230px;padding:clamp(24px,5vw,48px);border:1px solid var(--grid);border-radius:14px;background:var(--surface-1)}
h1{margin:0 0 12px;font-size:clamp(28px,4vw,40px);line-height:1.2;letter-spacing:-.025em}
p{margin:0;color:var(--text-secondary)}
</style>
</head>
<body>
<div class="wrap">
  <main class="dataset-placeholder" id="overview" data-dataset-state="pending" aria-labelledby="dataset-title">
    <h1 id="dataset-title">Dataset</h1>
    <p>Content coming soon.</p>
  </main>
</div>
</body>
</html>
