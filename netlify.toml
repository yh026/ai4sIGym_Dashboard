[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Preserve quoted search attributes and the validated scientific HTML verbatim.
[build.processing.html]
  pretty_urls = false

[context.production]
  command = "node scripts/build-production-release.cjs"

[context.deploy-preview]
  command = "node scripts/build-production-release.cjs --review"

[[context.branch-deploy.plugins]]
  package = "./netlify/plugins/preview-ready"
